[project]
name = "ecommerce-customer-intelligence-agent"
version = "0.1.0"
description = "Data and repository foundation for an ecommerce decision agent"
requires-python = ">=3.12"
dependencies = [
  "duckdb>=1.4,<2",
  "mcp>=1.20,<2",
  "pyyaml>=6.0,<7",
]

[project.scripts]
ecommerce-agent = "ecommerce_agent.cli:main"
ecommerce-agent-mcp = "ecommerce_agent.mcp_server:main"
ecommerce-agent-dashboard = "ecommerce_agent.dashboard:main"
ecommerce-agent-demo = "ecommerce_agent.demo_portal:main"
ecommerce-agent-portal = "ecommerce_agent.portal:main"
ecommerce-agent-diagnostics = "ecommerce_agent.monitoring:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true

